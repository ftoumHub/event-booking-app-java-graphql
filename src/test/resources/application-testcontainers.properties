spring.application.name=event-booking-app-testcontainers

# Testcontainers will override these with actual container values
spring.datasource.url=jdbc:postgresql://localhost:5432/event_booking_test
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver

# JDBC Configuration
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# GraphQL Configuration
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.path=/graphql

# Logging
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.testcontainers=DEBUG
